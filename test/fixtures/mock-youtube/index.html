<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock YouTube Watch</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; margin: 0; }
    #player { position: relative; width: 800px; height: 450px; background: #000; margin: 20px auto; }
    #mock-player { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    #controls { text-align: center; padding: 8px; }
    button { margin: 0 4px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1 style="text-align:center">Mock YouTube Watch — E2E 測試宿主</h1>
  <div id="player">
    <div id="mock-player">▶ Mock video playing...</div>
  </div>
  <div id="controls">
    <button id="btn-play">Play</button>
    <button id="btn-pause">Pause</button>
    <span id="clock">0.0s</span>
  </div>
  <script src="app.js"></script>
</body>
</html>
