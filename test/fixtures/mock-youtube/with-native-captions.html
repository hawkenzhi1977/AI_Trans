<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock YouTube Watch — With Native Captions</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; margin: 0; }
    #player { position: relative; width: 800px; height: 450px; background: #000; margin: 20px auto; }
    #mock-player { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    #controls { text-align: center; padding: 8px; }
    button { margin: 0 4px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1 style="text-align:center">Mock YouTube Watch — With Native Captions</h1>
  <div id="player">
    <div id="mock-player"><span id="mock-caption">▶ Mock video playing...</span></div>
    <!-- 供擴充 YouTubePlatformAdapter.observePlayback 讀取的模擬視頻元素。 -->
    <video class="html5-main-video" style="display:none"></video>
  </div>
  <div id="controls">
    <button id="btn-play">Play</button>
    <button id="btn-pause">Pause</button>
    <span id="clock">0.0s</span>
  </div>

  <!-- 模擬 YouTube 內嵌的 ytInitialPlayerResponse（純 JSON，供 FetchCaptionSource 解析）。
       baseUrl 指向同源 /timedtext 端點，由 app.js 的 fetch 攔截返回字幕。
       M1-45：baseUrl 的 v 由 JS 按當前 URL 動態注入，支持 SPA 換視頻場景。 -->
  <script>
    const _m = /[?&]v=([^&]+)/.exec(window.location.search);
    const _v = _m ? _m[1] : 'abc123';
    const _script = document.createElement('script');
    _script.id = 'ytInitialPlayerResponse';
    _script.type = 'application/json';
    _script.textContent = JSON.stringify({
      captions: {
        playerCaptionsTracklistRenderer: {
          captionTracks: [
            {
              baseUrl: '/timedtext?lang=en&v=' + encodeURIComponent(_v),
              languageCode: 'en',
              kind: 'standard',
            },
          ],
        },
      },
    });
    document.body.appendChild(_script);
  </script>

  <script src="app.js"></script>
</body>
</html>
